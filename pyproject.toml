[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodmentor"
version = "0.1.0"
description = "A reusable emotion-analysis package and command-line interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = [
    "torch>=2.2",
    "transformers>=4.40"
]

[project.scripts]
moodmentor = "moodmentor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moodmentor*", "ml"]
namespaces = false